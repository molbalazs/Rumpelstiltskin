name: Deploy

on:
  push:
    branches: [main]

permissions:
  id-token: write
  contents: read

jobs:
  plan:
    name: Plan Infrastructure Changes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: |
            frontend/package-lock.json
            infra/package-lock.json

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::231561175341:role/GitHubActionsDeployRole
          aws-region: eu-west-1

      - name: Build frontend
        run: |
          cd frontend
          npm ci
          npm run build

      - name: Install CDK dependencies
        run: |
          cd infra
          npm ci

      - name: CDK diff (show changes)
        run: |
          cd infra
          npx cdk diff

  deploy:
    name: Deploy to AWS
    runs-on: ubuntu-latest
    needs: plan
    environment:
      name: production
      url: https://d3mljvfc86c0ww.cloudfront.net
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: |
            frontend/package-lock.json
            infra/package-lock.json

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::231561175341:role/GitHubActionsDeployRole
          aws-region: eu-west-1

      - name: Build frontend
        run: |
          cd frontend
          npm ci
          npm run build

      - name: Install CDK dependencies
        run: |
          cd infra
          npm ci

      - name: Deploy infrastructure
        run: |
          cd infra
          npx cdk deploy --all --require-approval never
