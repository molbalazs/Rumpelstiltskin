name: CI

on:
  pull_request:
    branches: [main]

permissions:
  id-token: write
  contents: read
  pull-requests: write

jobs:
  infrastructure-plan:
    name: CDK Diff (Plan)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: |
            frontend/package-lock.json
            infra/package-lock.json

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::231561175341:role/GitHubActionsDeployRole
          aws-region: eu-west-1

      - name: Build frontend (required for synth)
        run: |
          cd frontend
          npm ci
          npm run build

      - name: Install CDK dependencies
        run: |
          cd infra
          npm ci

      - name: CDK diff
        run: |
          cd infra
          npx cdk acknowledge 34892 2>/dev/null || true
          npx cdk acknowledge 32775 2>/dev/null || true
          npx cdk diff --no-color 2>&1 | tee cdk-diff.txt

      - name: Comment PR with diff
        uses: actions/github-script@v7
        if: github.event_name == 'pull_request'
        with:
          script: |
            const fs = require('fs');
            const diff = fs.readFileSync('infra/cdk-diff.txt', 'utf8');
            // Hidden marker so later runs find and update this comment instead of adding a new one
            const marker = '<!-- cdk-diff-comment -->';
            const body = `${marker}\n### CDK Infrastructure Plan\n\`\`\`\n${diff.substring(0, 64000)}\n\`\`\``;
            const comments = await github.paginate(github.rest.issues.listComments, {
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
            });
            const existing = comments.find(c => c.user.type === 'Bot' && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                comment_id: existing.id,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body,
              });
            }

  frontend-test:
    name: Frontend Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Run Cypress tests
        uses: cypress-io/github-action@v6
        with:
          working-directory: frontend
          start: npm run dev
          wait-on: 'http://localhost:5173'
          wait-on-timeout: 60

  backend-test:
    name: Backend Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      localstack:
        image: localstack/localstack:3.7
        ports:
          - 4566:4566
        env:
          SERVICES: dynamodb
          DEFAULT_REGION: us-east-1
          EAGER_SERVICE_LOADING: 1
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run unit tests
        run: pytest tests/unit -v

      - name: Run BDD integration tests
        run: pytest tests/bdd -v
        env:
          AWS_ENDPOINT_URL: http://localhost:4566
          AWS_DEFAULT_REGION: us-east-1
          AWS_ACCESS_KEY_ID: test
          AWS_SECRET_ACCESS_KEY: test

  e2e-test:
    name: E2E Tests
    runs-on: ubuntu-latest
    services:
      localstack:
        image: localstack/localstack:3.7
        ports:
          - 4566:4566
        env:
          SERVICES: dynamodb
          DEFAULT_REGION: us-east-1
          EAGER_SERVICE_LOADING: 1
    env:
      AWS_ENDPOINT_URL: http://localhost:4566
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_DEFAULT_REGION: us-east-1
      GLOBAL_DAILY_CAP: 5
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: |
            frontend/package-lock.json
            e2e/package-lock.json

      - name: Install backend dependencies
        working-directory: backend
        run: pip install -r requirements.txt

      - name: Wait for LocalStack
        run: |
          timeout 60 bash -c 'until curl -sf http://localhost:4566/_localstack/health | jq -e ".services.dynamodb | test(\"available|running\")" > /dev/null; do sleep 2; done'

      - name: Start local API
        working-directory: backend
        # Creates its DynamoDB tables in LocalStack, then serves the API on :3000
        run: nohup python3 local_server.py > "$RUNNER_TEMP/api.log" 2>&1 &

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Start frontend
        working-directory: frontend
        run: nohup npx vite --port 5174 --strictPort > "$RUNNER_TEMP/frontend.log" 2>&1 &
        env:
          VITE_API_URL: http://localhost:3000

      - name: Run Gherkin suite
        uses: cypress-io/github-action@v6
        with:
          working-directory: e2e
          wait-on: 'http://localhost:3000/health, http://localhost:5174'
          wait-on-timeout: 120
        env:
          APP_URL: http://localhost:5174
          API_URL: http://localhost:3000

      - name: Upload Cypress screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-screenshots
          path: e2e/cypress/screenshots
          if-no-files-found: ignore

      - name: Show server logs
        if: failure()
        run: |
          echo '--- API ---'; cat "$RUNNER_TEMP/api.log" || true
          echo '--- Frontend ---'; cat "$RUNNER_TEMP/frontend.log" || true
